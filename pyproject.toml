[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ardupilot-mcp"
dynamic = ["version"]
description = "ArduPilot uçuş loglarını teşhis eden deterministik MCP sunucusu · Deterministic MCP server that diagnoses ArduPilot flight logs"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Furkan IŞIKAY" }]
keywords = ["mcp", "model-context-protocol", "ardupilot", "dataflash", "flight-log", "diagnostics", "mavlink", "drone", "uav"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp>=2.3.0,<3",
    "pymavlink>=2.4.50",
    "numpy>=2.4.6",
]

# Lint/type tools are pinned so local and CI use the exact same versions
# (a newer ruff/mypy can introduce new rules and fail CI that passed locally).
[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff==0.17.0", "mypy==2.4.0", "build>=1.6.1", "pre-commit>=4.7.0"]

[project.urls]
Homepage = "https://github.com/furkanisikay/ardupilot-mcp"
Repository = "https://github.com/furkanisikay/ardupilot-mcp"
Issues = "https://github.com/furkanisikay/ardupilot-mcp/issues"
Changelog = "https://github.com/furkanisikay/ardupilot-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/furkanisikay/ardupilot-mcp/blob/main/docs/reference.md"

[project.scripts]
ardupilot-mcp = "ardupilot_mcp.__main__:main"

[tool.hatch.version]
path = "ardupilot_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ardupilot_mcp"]

[tool.hatch.build.targets.sdist]
include = ["ardupilot_mcp", "README.md", "README.en.md", "LICENSE", "CHANGELOG.md", "docs/SOURCES.md", "docs/reference.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# pycodestyle(E,W), pyflakes(F), isort(I), pyupgrade(UP), bugbear(B), comprehensions(C4)
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # line length handled by the formatter, not enforced as an error
    "UP042",  # `class X(str, Enum)` is a deliberate choice (clean Pydantic/JSON value serialization)
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["ardupilot_mcp"]
warn_unused_ignores = true
