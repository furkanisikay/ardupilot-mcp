version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Widen a range only when a new release falls outside it; never raise a floor that
    # still works (users install alongside other packages).
    versioning-strategy: increase-if-necessary
    labels: ["dependencies", "skip-changelog"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci", "skip-changelog"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
