# Weekly: run the tests against the newest releases of the libraries the server is built
# on (MCP SDK, pymavlink, numpy, pydantic), pre-releases and versions beyond our upper
# bounds included. A failure opens (or updates) one issue, so a new protocol revision or
# a pymavlink change is known before users hit it.
name: Upstream

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    name: Test against the latest upstream releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Upgrade the core libraries past our bounds
        run: pip install --upgrade --pre mcp pymavlink numpy pydantic
      - name: Versions under test
        id: versions
        run: |
          v=$(pip list --format=freeze | grep -iE '^(mcp|pymavlink|numpy|pydantic)==' | tr '\n' ' ')
          echo "list=$v" >> "$GITHUB_OUTPUT"
          echo "$v"
      - name: Run tests
        id: tests
        run: pytest
      - name: Report the break
        # Only a test failure is an upstream break; an install or network error is not.
        if: failure() && steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ steps.versions.outputs.list }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upstream release breaks the test suite"
          body=$(printf 'The weekly upstream run failed with: %s\n\nRun: %s' "$VERSIONS" "$RUN_URL")
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label dependencies
          fi
