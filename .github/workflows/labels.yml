# Creates or updates the repository labels from .github/labels.json.
name: Labels

on:
  push:
    branches: [main]
    paths: [".github/labels.json"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Create or update each label
        run: |
          jq -c '.[]' .github/labels.json | while read -r label; do
            gh label create "$(jq -r .name <<<"$label")" \
              --color "$(jq -r .color <<<"$label")" \
              --description "$(jq -r .description <<<"$label")" \
              --force --repo "${{ github.repository }}"
          done
