name: Wrong or missed diagnosis
description: On a real log the tool missed a fault, flagged a healthy flight or named the wrong cause.
labels: ["diagnosis"]
body:
  - type: markdown
    attributes:
      value: A log where the tool got it wrong is the most useful thing you can send. It turns into a new or fixed check and a benchmark entry.
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong?
      options:
        - Missed a real problem (false negative)
        - Flagged a healthy flight (false positive)
        - Named the wrong cause
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened to the aircraft?
      description: For example "crashed on takeoff, an ESC desync" or "flew fine".
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What did the tool report?
      description: The relevant findings from analyze_log, or "nothing".
      render: text
  - type: input
    id: firmware
    attributes:
      label: Vehicle and firmware
      placeholder: "ArduCopter 4.5.7, quad X"
  - type: textarea
    id: log
    attributes:
      label: Log and evidence
      description: Attach the log, link to it or to the forum thread, or paste the relevant values. A .bin or .tlog holds GPS positions; share it only if you are fine with that.
