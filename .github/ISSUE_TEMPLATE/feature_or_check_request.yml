name: Feature or check request
description: A new diagnostic check, tool or capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should it detect or do?
      description: For example "detect compass and GPS heading divergence (toilet bowl)" or "read PX4 ULog".
    validations:
      required: true
  - type: textarea
    id: signal
    attributes:
      label: How does it show in a log?
      description: The DataFlash messages or parameters involved, and the threshold or behaviour that signals the problem.
  - type: textarea
    id: source
    attributes:
      label: Source
      description: An ArduPilot wiki page, firmware file or developer post that backs the threshold. Every threshold needs one.
